name: Bundled Linux media runtime

on:
  workflow_call:
  pull_request:
    paths:
      - 'backend/internal/pkg/mediaprobe/**'
      - 'deploy/build-ffprobe.sh'
      - '.github/workflows/ffprobe-runtime.yml'
      - '.github/workflows/release.yml'
      - '.goreleaser*.yaml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Build static Linux ffprobe
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.22 sh -ec '
            apk add --no-cache bash build-base curl xz binutils
            bash deploy/build-ffprobe.sh linux "${{ matrix.arch }}"
          '
      - name: Verify offline runtime provisioning and real media probing
        working-directory: backend
        run: go test -tags=bundled_ffprobe ./internal/pkg/mediaprobe -count=1
      - uses: actions/upload-artifact@v7
        with:
          name: ffprobe-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            backend/internal/pkg/mediaprobe/payload_${{ matrix.os }}_${{ matrix.arch }}.go
            backend/internal/pkg/mediaprobe/ffprobe_${{ matrix.os }}_${{ matrix.arch }}.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64'
        with:
          name: ffprobe-source
          path: dist/ffprobe-source/
          if-no-files-found: error
